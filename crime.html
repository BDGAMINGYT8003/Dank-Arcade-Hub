<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dank Arcade Hub - Crime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* BASE THEME VARIABLES AND STYLES (MATCHING HUB) */
        :root {
            --panel-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --popup-bg: #1e293b;
            --accent: #22ffc5;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-glow: rgba(98, 255, 237, 0.35);
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            --button-gradient-crime: linear-gradient(135deg, #ec4899 0%, #f472b6 100%); /* Pink/Crime gradient */
            --button-gradient-fail: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            --button-gradient-success: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --button-gradient-disabled: linear-gradient(135deg, #3d4f66 0%, #2f3d52 100%);
            --border-radius: 16px;
        }

        body {
            background-color: #0f172a; 
            color: var(--text-primary);
            font-family: 'Chakra Petch', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Header/Balance UI (Matching Hub) --- */
        .balance-bar { display: flex; align-items: center; justify-content: center; padding: 12px 16px; gap: 12px; position: relative; margin-bottom: 30px; }
        .balance-card { flex: 1; max-width: 180px; position: relative; cursor: pointer; padding: 12px; border-radius: 16px; background: var(--panel-gradient); border: 1px solid rgba(98, 255, 237, 0.35); transition: transform 0.2s ease; z-index: 10; }
        .balance-card:hover { transform: translateY(-2px); }
        .balance-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 4px; }
        .balance-amount { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
        .currency-symbol { font-size: 1rem; padding: 4px 8px; border-radius: 8px; background: rgba(34, 255, 197, 0.18); color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
        .currency-icon { width: 24px; height: 24px; }
        .balance-popup { position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--popup-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-glow); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7); opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; z-index: 1000; white-space: nowrap; color: var(--text-primary); min-width: 150px; text-align: center; }
        .balance-popup::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 12px; height: 12px; background: var(--popup-bg); border-left: 1px solid var(--border-glow); border-top: 1px solid var(--border-glow); z-index: 1001; }
        .balance-card.active .balance-popup { opacity: 1; visibility: visible; }
        .balance-popup .balance-amount { display: inline-flex; justify-content: center; align-items: center; width: 100%; }

        .section-title { font-size: 1.8rem; font-weight: 700; color: var(--accent); text-align: center; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 25px; }

        /* --- Crime Page Specific Styles --- */
        .crime-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; }
        .crime-activity-button { position: relative; height: 140px; background: var(--panel-gradient); border-radius: var(--border-radius); display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; color: var(--text-primary); overflow: hidden; box-shadow: var(--shadow); transition: transform 0.2s ease, box-shadow 0.2s ease; border: 1px solid rgba(98, 255, 237, 0.1); cursor: pointer; }
        .crime-activity-button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); }
        .crime-activity-button::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; z-index: 1; background: var(--button-gradient-crime); }
        .crime-activity-button.success::before { background: var(--button-gradient-success); }
        .crime-activity-button.fail::before { background: var(--button-gradient-fail); }
        .crime-activity-button:disabled { opacity: 0.8; cursor: default; }
        .activity-icon { font-size: 2.5rem; margin-bottom: 15px; }
        .activity-name { font-weight: 600; text-align: center; padding: 0 10px; font-size: 1rem; }

        #resultContainer { margin-top: 30px; padding: 20px; background: var(--panel-gradient); border-radius: var(--border-radius); border: 1px solid var(--border-glow); text-align: center; display: none; }
        #resultTitle { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
        #resultMessage { font-size: 1.1rem; color: var(--text-secondary); }
        #resultChange { font-size: 2rem; font-weight: 700; margin-top: 15px; }
        #resultChange.success { color: var(--accent); }
        #resultChange.fail { color: var(--button-gradient-fail); }

        #commitAgainButton { margin-top: 20px; padding: 10px 20px; background: var(--button-gradient-crime); border: none; border-radius: 8px; color: var(--text-primary); font-weight: 600; cursor: pointer; transition: background 0.3s ease; }
        #commitAgainButton:disabled { background: var(--button-gradient-disabled); cursor: not-allowed; opacity: 0.7; }

        #cooldownArea { padding: 30px; background: var(--panel-gradient); border-radius: var(--border-radius); border: 1px solid var(--border-glow); text-align: center; display: none; }
        #cooldownIcon { font-size: 3rem; margin-bottom: 15px; color: #ef4444; }
        #cooldownTitle { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
        #postCrimeCooldownTimer, #postRefreshCooldownTimer { margin-top: 15px; font-size: 1.1rem; color: var(--text-secondary); font-weight: 600; display: none; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--popup-bg); color: var(--text-primary); padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity 0.3s ease; z-index: 9999; pointer-events: none; border: 1px solid var(--border-glow); }
        .toast.show { opacity: 1; }

        /* --- ANIMATION & TRANSITION STYLES --- */
        html, body {
            overscroll-behavior: none;
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none; /* Chrome, Safari, and Opera */
        }
        body {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10+ and Edge */
            user-select: none; /* Standard syntax */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #loading-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--border-glow);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #body-wrapper {
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
        }
        #body-wrapper.fade-out {
            opacity: 0;
        }
        /* 3D Button Click Animation */
        .command-button, .balance-card, .crime-activity-button, #commitAgainButton {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out !important;
        }
        .command-button:active, .balance-card:active, .crime-activity-button:active, #commitAgainButton:active {
            transform: perspective(800px) translateZ(20px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>
    <div id="body-wrapper">
        <div class="container">
            <!-- HEADER/BALANCE BAR -->
            <header>
                <div class="balance-bar">
                    <div class="balance-card" id="at-card"><div class="balance-label">Arcade<br>Tokens</div><div class="balance-amount"><span class="abbreviated">0.00</span><span class="currency-symbol"><img src="images/AT.png" alt="AT" class="currency-icon">AT</span></div><div class="balance-popup"><div class="balance-label">Full Balance</div><div class="balance-amount"><span class="full">0</span><span class="currency-symbol"><img src="images/AT.png" alt="AT" class="currency-icon">AT</span></div></div></div>
                    <div class="balance-card" id="gj-card"><div class="balance-label">Golden<br>Joysticks</div><div class="balance-amount"><span class="abbreviated">0.00</span><span class="currency-symbol"><img src="images/GJ.png" alt="GJ" class="currency-icon">GJ</span></div><div class="balance-popup"><div class="balance-label">Full Balance</div><div class="balance-amount"><span class="full">0</span><span class="currency-symbol"><img src="images/GJ.png" alt="GJ" class="currency-icon">GJ</span></div></div></div>
                </div>
            </header>

            <!-- CRIME AREA (Default View) -->
            <div id="crimeArea">
                <h2 class="section-title">Commit a Crime</h2>
                <div class="crime-info" style="color: var(--text-secondary); text-align: center; margin-bottom: 25px;">
                    Choose one activity below. High risk, high reward... or high fines.
                </div>
                <div id="crimeGrid" class="crime-grid"></div>
            </div>

            <!-- RESULT AREA (Post-Crime View) -->
            <div id="resultContainer">
                <div id="resultTitle">Result</div>
                <div id="resultMessage"></div>
                <div id="resultChange"></div>
                <button id="commitAgainButton" onclick="location.reload()">Commit Another Crime</button>
                <div id="postCrimeCooldownTimer"></div>
            </div>

            <!-- COOLDOWN AREA (Post-Refresh View) -->
            <div id="cooldownArea">
                <i class="fa-solid fa-clock cooldown-icon"></i>
                <div id="cooldownTitle">Lying Low</div>
                <div id="postRefreshCooldownTimer"></div>
            </div>

            <a href="index.html" style="display: block; margin-top: 30px; color: var(--accent); text-align: center; text-decoration: none;">&larr; Back to Hub</a>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <script>
        // --- Simulated crimes.json Data ---
        const CRIME_ACTIVITIES_DATA = [
            { name: "Pickpocketing", icon: "fa-solid fa-person-walking-arrow-right", successRate: 0.60, rewardRange: [2000, 4000], fineRange: [500, 1000], successOutcomes: ["You snagged a wallet without anyone noticing.", "A quick hand and a distracted tourist made for an easy score.", "You found a hefty roll of tokens in someone's back pocket."], failureOutcomes: ["Your target felt your hand and shouted, forcing you to flee empty-handed.", "You were caught by a security guard but managed to get away with just a warning.", "You picked an empty pocket. Bad luck."] },
            { name: "Shoplifting", icon: "fa-solid fa-bag-shopping", successRate: 0.35, rewardRange: [6000, 10000], fineRange: [1500, 3000], successOutcomes: ["You slipped a valuable item into your bag and walked out casually.", "The cashier was busy. You took your chance and it paid off.", "You successfully swapped the price tags on a high-value item and sold it."], failureOutcomes: ["The store's security alarm went off! You dropped everything and ran.", "An employee spotted you and you had to pay a 're-stocking fee' to avoid trouble.", "You got greedy and the item you took was a worthless display model."] },
            { name: "Tax Evasion", icon: "fa-solid fa-file-invoice-dollar", successRate: 0.40, rewardRange: [12000, 20000], fineRange: [3000, 6000], successOutcomes: ["Your creative accounting skills fooled the auditors completely.", "You found a legal loophole that saved you a huge chunk of tokens.", "You 'forgot' to declare some income and got away with it."], failureOutcomes: ["An audit was triggered and you had to pay back taxes plus a hefty penalty.", "Your accountant made a mistake and now you owe the government.", "You were too obvious and got hit with a fine for tax fraud."] },
            { name: "Hacking", icon: "fa-solid fa-laptop-code", successRate: 0.20, rewardRange: [20000, 40000], fineRange: [5000, 10000], successOutcomes: ["You breached the firewall of a major corporation and siphoned off some tokens.", "You found an exploit in the crypto market and made a massive profit.", "You successfully executed a phishing scam on a wealthy individual."], failureOutcomes: ["Your IP was traced! You had to pay a fine to the cyber-police to make it go away.", "The system's anti-cheat detected you and froze a portion of your assets.", "You triggered a honeypot and wasted hours for nothing."] },
            { name: "Bank Robbery", icon: "fa-solid fa-vault", successRate: 0.10, rewardRange: [30000, 60000], fineRange: [8000, 15000], successOutcomes: ["The heist went perfectly! You and your crew are rich!", "You cracked the vault and made off with bags of tokens.", "Your getaway driver was a pro. A clean escape with a huge score."], failureOutcomes: ["The silent alarm was tripped. You barely escaped and had to bribe a guard to forget your face.", "A dye pack exploded in one of the bags, ruining most of the score and costing you to clean up.", "Your plan was flawed from the start. You got away but lost more in gear than you could steal."] }
        ];

        const CRIME_COOLDOWN_SECONDS = 25;
        let cooldownInterval;

        // --- IndexedDB Wrapper Class (REPLICATED) ---
        class UserDB {
            constructor() { this.dbName = 'DankArcadeHubDB'; this.storeName = 'userData'; this.db = null; }
            async open() { return new Promise((resolve, reject) => { if (this.db) { resolve(this.db); return; } const request = indexedDB.open(this.dbName, 1); request.onupgradeneeded = (event) => { const db = event.target.result; if (!db.objectStoreNames.contains(this.storeName)) { db.createObjectStore(this.storeName); } }; request.onsuccess = (event) => { this.db = event.target.result; resolve(this.db); }; request.onerror = (event) => { console.error("IndexedDB error:", event.target.errorCode); reject(new Error("Failed to open IndexedDB")); }; }); }
            async get(key) { const db = await this.open(); return new Promise((resolve, reject) => { const transaction = db.transaction(this.storeName, 'readonly'); const store = transaction.objectStore(this.storeName); const request = store.get(key); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); }
            async set(key, value) { const db = await this.open(); return new Promise((resolve, reject) => { const transaction = db.transaction(this.storeName, 'readwrite'); const store = transaction.objectStore(this.storeName); const request = store.put(value, key); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); }
        }

        const userDB = new UserDB();

        // --- Core Application Logic (REPLICATED) ---
        function formatNumber(num) { if (num < 1000) return num.toLocaleString(undefined, { maximumFractionDigits: 0 }); if (num >= 1e12) return (num / 1e12).toFixed(2) + 't'; if (num >= 1e9) return (num / 1e9).toFixed(2) + 'b'; if (num >= 1e6) return (num / 1e6).toFixed(2) + 'm'; if (num >= 1e3) return (num / 1e3).toFixed(2) + 'k'; return num.toString(); }
        function showToast(message, duration = 3000) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(() => { toast.classList.remove('show'); }, duration); }

        async function getUserData() {
            const defaultData = { arcadeTokens: 0, goldenJoysticks: 0, crimeCooldownEnd: 0 };
            try {
                let data = await userDB.get('user');
                if (!data) { data = defaultData; await userDB.set('user', data); }
                data.crimeCooldownEnd = data.crimeCooldownEnd || 0;
                return data;
            } catch (e) { console.error("Error retrieving user data:", e); return defaultData; }
        }

        async function saveUserData(data) { try { await userDB.set('user', data); } catch (e) { console.error("Error saving user data:", e); showToast("Error saving data!", 5000); } }

        async function updateBalances() {
            const data = await getUserData();
            document.querySelector('#at-card .abbreviated').textContent = formatNumber(data.arcadeTokens);
            document.querySelector('#at-card .full').textContent = data.arcadeTokens.toLocaleString();
            document.querySelector('#gj-card .abbreviated').textContent = formatNumber(data.goldenJoysticks);
            document.querySelector('#gj-card .full').textContent = data.goldenJoysticks.toLocaleString();
            return data;
        }

        // --- Crime Functionality ---
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function getRandomSelection(array) { return array[Math.floor(Math.random() * array.length)]; }
        function selectRandomActivities(data, count) { const shuffled = data.sort(() => 0.5 - Math.random()); return shuffled.slice(0, count); }

        function createActivityButton(activityData) {
            const button = document.createElement('button');
            button.className = 'crime-activity-button';
            button.innerHTML = `<i class="${activityData.icon} activity-icon"></i><div class="activity-name">${activityData.name}</div>`;
            button.addEventListener('click', () => handleCrime(button, activityData));
            return button;
        }

        function renderCrimeOptions() {
            const crimeGrid = document.getElementById('crimeGrid');
            if (!crimeGrid) return;
            crimeGrid.innerHTML = '';
            const activities = selectRandomActivities(CRIME_ACTIVITIES_DATA, 3);
            activities.forEach(activity => { crimeGrid.appendChild(createActivityButton(activity)); });
            const crimeArea = document.getElementById('crimeArea');
            if(crimeArea) crimeArea.style.display = 'block';
        }

        function startPostCrimeCooldown(endTime) {
            clearInterval(cooldownInterval);
            const commitAgainButton = document.getElementById('commitAgainButton');
            const cooldownTimer = document.getElementById('postCrimeCooldownTimer');
            if (!commitAgainButton || !cooldownTimer) return;

            const updateTimer = () => {
                const remainingMs = endTime - Date.now();
                if (remainingMs <= 0) {
                    clearInterval(cooldownInterval);
                    commitAgainButton.disabled = false;
                    cooldownTimer.style.display = 'none';
                    return;
                }
                commitAgainButton.disabled = true;
                cooldownTimer.style.display = 'block';
                const remainingSeconds = Math.ceil(remainingMs / 1000);
                cooldownTimer.textContent = `You can commit another crime in ${remainingSeconds} seconds.`;
            };
            updateTimer();
            cooldownInterval = setInterval(updateTimer, 1000);
        }

        function startPostRefreshCooldown(endTime) {
            clearInterval(cooldownInterval);
            const cooldownArea = document.getElementById('cooldownArea');
            const cooldownTimer = document.getElementById('postRefreshCooldownTimer');
            if (!cooldownArea || !cooldownTimer) return;
            cooldownArea.style.display = 'block';

            const updateTimer = () => {
                const remainingMs = endTime - Date.now();
                if (remainingMs <= 0) {
                    clearInterval(cooldownInterval);
                    cooldownArea.style.display = 'none';
                    renderCrimeOptions();
                    return;
                }
                cooldownTimer.style.display = 'block';
                const remainingSeconds = Math.ceil(remainingMs / 1000);
                cooldownTimer.textContent = `You need to lie low for ${remainingSeconds} more seconds.`;
            };
            updateTimer();
            cooldownInterval = setInterval(updateTimer, 1000);
        }

        async function handleCrime(button, activityData) {
            document.querySelectorAll('.crime-activity-button').forEach(btn => btn.disabled = true);

            const data = await getUserData();
            let isSuccess = Math.random() < activityData.successRate;
            let message = '';
            let changeAmount = 0;

            if (isSuccess) {
                changeAmount = getRandomInt(activityData.rewardRange[0], activityData.rewardRange[1]);
                message = getRandomSelection(activityData.successOutcomes);
                data.arcadeTokens += changeAmount;
                button.classList.add('success');
            } else {
                const fine = getRandomInt(activityData.fineRange[0], activityData.fineRange[1]);
                changeAmount = Math.min(data.arcadeTokens, fine);
                message = getRandomSelection(activityData.failureOutcomes);
                data.arcadeTokens -= changeAmount;
                button.classList.add('fail');
            }

            const cooldownEndTime = Date.now() + (CRIME_COOLDOWN_SECONDS * 1000);
            data.crimeCooldownEnd = cooldownEndTime;

            await saveUserData(data);
            await updateBalances();

            document.getElementById('crimeArea').style.display = 'none';
            const resultContainer = document.getElementById('resultContainer');
            const resultChangeEl = document.getElementById('resultChange');

            document.getElementById('resultTitle').textContent = isSuccess ? "GETAWAY!" : "BUSTED!";
            document.getElementById('resultMessage').textContent = message;

            if (isSuccess) {
                resultChangeEl.textContent = `${changeAmount.toLocaleString()} AT Earned`;
                resultChangeEl.className = 'success';
            } else {
                resultChangeEl.textContent = `${changeAmount.toLocaleString()} AT Lost`;
                resultChangeEl.className = 'fail';
            }

            resultContainer.style.display = 'block';
            startPostCrimeCooldown(cooldownEndTime);
        }

        function setupBalanceCards() {
            const cards = document.querySelectorAll('.balance-card');
            cards.forEach(card => { card.addEventListener('click', function(e) { cards.forEach(c => { if (c !== card) c.classList.remove('active'); }); this.classList.toggle('active'); }); });
            document.addEventListener('click', function(e) { if (!e.target.closest('.balance-card')) { cards.forEach(card => card.classList.remove('active')); } });
        }

        // --- ANIMATION & TRANSITION SCRIPT ---
        function handleNavigation(event) {
            const link = event.currentTarget;
            const url = new URL(link.href, window.location.origin);
            if (url.origin !== window.location.origin || link.target === '_blank' || event.ctrlKey || event.metaKey) return;
            event.preventDefault();
            const bodyWrapper = document.getElementById('body-wrapper');
            const loadingOverlay = document.getElementById('loading-overlay');
            bodyWrapper.classList.add('fade-out');
            setTimeout(() => { loadingOverlay.classList.add('visible'); }, 200);
            fetch(url.href)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const newBodyWrapper = doc.getElementById('body-wrapper');
                    const newTitle = doc.querySelector('title').innerText;
                    setTimeout(() => {
                        bodyWrapper.innerHTML = newBodyWrapper.innerHTML;
                        document.title = newTitle;
                        history.pushState({}, newTitle, url.href);
                        const newMainScript = Array.from(doc.querySelectorAll('script')).find(s => s.innerText.includes('new UserDB'));
                        if (newMainScript) {
                           eval(newMainScript.innerText);
                        }
                        loadingOverlay.classList.remove('visible');
                        setTimeout(() => { bodyWrapper.classList.remove('fade-out'); }, 50);
                    }, 1200);
                })
                .catch(err => {
                    console.error('Failed to load page: ', err);
                    window.location.href = url.href;
                });
        }

        function attachNavigationHandlers() {
            document.querySelectorAll('a[href]').forEach(link => {
                const url = new URL(link.href, window.location.origin);
                if (url.origin === window.location.origin && !link.href.endsWith('#')) {
                    link.removeEventListener('click', handleNavigation);
                    link.addEventListener('click', handleNavigation);
                }
            });
        }

        // --- Initialization ---
        function initializePage() {
            userDB.open().catch(e => {
                console.error("DB Initialization Failed:", e);
                showToast("Failed to load user data from storage!", 8000);
            });
            updateBalances().then(data => {
                const now = Date.now();
                const crimeArea = document.getElementById('crimeArea');
                const resultContainer = document.getElementById('resultContainer');
                const cooldownArea = document.getElementById('cooldownArea');

                if (crimeArea) crimeArea.style.display = 'none';
                if (resultContainer) resultContainer.style.display = 'none';
                if (cooldownArea) cooldownArea.style.display = 'none';

                if (data.crimeCooldownEnd > now) {
                    startPostRefreshCooldown(data.crimeCooldownEnd);
                } else {
                    renderCrimeOptions();
                }
            });
            setupBalanceCards();
            attachNavigationHandlers();
        }

        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
