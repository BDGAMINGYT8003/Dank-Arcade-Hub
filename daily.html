<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dank Arcade Hub - Daily Claim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/daily.css">
</head>
<body>
    <div class="container">
        <!-- HEADER/BALANCE BAR -->
        <header>
            <div class="balance-bar">
                <div class="balance-card" id="at-card">
                    <div class="balance-label">Arcade<br>Tokens</div>
                    <div class="balance-amount">
                        <span class="abbreviated">0.00</span>
                        <span class="currency-symbol">
                        <img src="images/AT.png" alt="AT" class="currency-icon">
                        AT
                    </span>
                    </div>
                    <div class="balance-popup">
                        <div class="balance-label">Full Balance</div>
                        <div class="balance-amount">
                            <span class="full">0</span>
                            <span class="currency-symbol">
                            <img src="images/AT.png" alt="AT" class="currency-icon">
                            AT
                        </span>
                        </div>
                    </div>
                </div>

                <div class="balance-card" id="gj-card">
                    <div class="balance-label">Golden<br>Joysticks</div>
                    <div class="balance-amount">
                        <span class="abbreviated">0.00</span>
                        <span class="currency-symbol">
                        <img src="images/GJ.png" alt="GJ" class="currency-icon">
                        GJ
                    </span>
                    </div>
                    <div class="balance-popup">
                        <div class="balance-label">Full Balance</div>
                        <div class="balance-amount">
                            <span class="full">0</span>
                            <span class="currency-symbol">
                            <img src="images/GJ.png" alt="GJ" class="currency-icon">
                            GJ
                        </span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- DAILY CLAIM CARD -->
        <h2 class="section-title">Daily Claim</h2>
        <div class="daily-card">
            <i class="fa-solid fa-calendar-day daily-icon"></i>
            <div id="dailyStreak" class="daily-streak">Current Streak: 0 Day(s)</div>
            <div id="dailyReward" class="daily-reward">Reward: 1,000 AT</div>

            <button id="claimButton" class="daily-button" disabled>
                Claim Daily Reward
            </button>

            <div id="timer" class="daily-timer" style="display: none;">
                Next claim in: --:--:--
            </div>
            <a href="index.html" style="display: block; margin-top: 20px; color: var(--accent); text-decoration: none;">&larr; Back to Hub</a>
        </div>
    </div>

    <!-- Toast for Notifications -->
    <div id="toast" class="toast"></div>

    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/daily.js"></script>
</body>
</html>
