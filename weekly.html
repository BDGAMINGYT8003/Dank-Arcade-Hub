<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dank Arcade Hub - Weekly Claim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* BASE THEME VARIABLES AND STYLES (MATCHING HUB) */
        :root {
            --panel-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --popup-bg: #1e293b;
            --accent: #22ffc5;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-glow: rgba(98, 255, 237, 0.35);
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            --button-gradient-weekly: linear-gradient(135deg, #44cc88 0%, #10b981 100%); /* Green gradient for weekly */
            --button-gradient-weekly-disabled: linear-gradient(135deg, #3d4f66 0%, #2f3d52 100%);
            --border-radius: 16px;
        }

        body {
            background-color: #0f172a; 
            color: var(--text-primary);
            font-family: 'Chakra Petch', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Header/Balance UI (Matching Hub) --- */
        .balance-bar { display: flex; align-items: center; justify-content: center; padding: 12px 16px; gap: 12px; position: relative; margin-bottom: 30px; }
        .balance-card { flex: 1; max-width: 180px; position: relative; cursor: pointer; padding: 12px; border-radius: 16px; background: var(--panel-gradient); border: 1px solid var(--border-glow); transition: transform 0.2s ease; z-index: 10; }
        .balance-card:hover { transform: translateY(-2px); }
        .balance-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 4px; }
        .balance-amount { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
        .currency-symbol { font-size: 1rem; padding: 4px 8px; border-radius: 8px; background: rgba(34, 255, 197, 0.18); color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
        .currency-icon { width: 24px; height: 24px; }
        .balance-popup { position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--popup-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-glow); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7); opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; z-index: 1000; white-space: nowrap; color: var(--text-primary); min-width: 150px; text-align: center; }
        .balance-popup::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 12px; height: 12px; background: var(--popup-bg); border-left: 1px solid var(--border-glow); border-top: 1px solid var(--border-glow); z-index: 1001; }
        .balance-card.active .balance-popup { opacity: 1; visibility: visible; }
        .balance-popup .balance-amount { display: inline-flex; justify-content: center; align-items: center; width: 100%; }

        .section-title { font-size: 1.8rem; font-weight: 700; color: var(--accent); text-align: center; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 25px; }

        /* --- Weekly Page Specific Styles --- */
        .weekly-card { background: var(--panel-gradient); border-radius: var(--border-radius); padding: 30px; border: 1px solid var(--border-glow); box-shadow: var(--shadow); text-align: center; }
        .weekly-icon { font-size: 4rem; color: #34d399; margin-bottom: 15px; }
        .weekly-streak { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 15px; }
        .weekly-reward { font-size: 2.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 25px; }
        .weekly-button { display: block; width: 100%; padding: 15px 20px; border: none; border-radius: 10px; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: background 0.3s ease, transform 0.1s ease; color: var(--text-primary); background: var(--button-gradient-weekly); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); }
        .weekly-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5); }
        .weekly-button:active:not(:disabled) { transform: translateY(0); }
        .weekly-button:disabled { background: var(--button-gradient-weekly-disabled); cursor: not-allowed; opacity: 0.7; }
        .weekly-timer { font-size: 1.2rem; color: #ef4444; margin-top: 20px; font-weight: 600; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--popup-bg); color: var(--text-primary); padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity 0.3s ease; z-index: 9999; pointer-events: none; border: 1px solid var(--border-glow); }
        .toast.show { opacity: 1; }

        /* --- ANIMATION & TRANSITION STYLES --- */
        html, body {
            overscroll-behavior: none;
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none; /* Chrome, Safari, and Opera */
        }
        body {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10+ and Edge */
            user-select: none; /* Standard syntax */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #loading-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--border-glow);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #body-wrapper {
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
        }
        #body-wrapper.fade-out {
            opacity: 0;
        }
        /* 3D Button Click Animation */
        .command-button, .balance-card, .weekly-button {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out !important;
        }
        .command-button:active, .balance-card:active, .weekly-button:active {
            transform: perspective(800px) translateZ(20px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>
    <div id="body-wrapper">
        <div class="container">
            <!-- HEADER/BALANCE BAR -->
            <header>
                <div class="balance-bar">
                    <div class="balance-card" id="at-card">
                        <div class="balance-label">Arcade<br>Tokens</div>
                        <div class="balance-amount">
                            <span class="abbreviated">0.00</span>
                            <span class="currency-symbol">
                            <img src="images/AT.png" alt="AT" class="currency-icon">
                            AT
                        </span>
                        </div>
                        <div class="balance-popup">
                            <div class="balance-label">Full Balance</div>
                            <div class="balance-amount">
                                <span class="full">0</span>
                                <span class="currency-symbol">
                                <img src="images/AT.png" alt="AT" class="currency-icon">
                                AT
                            </span>
                            </div>
                        </div>
                    </div>

                    <div class="balance-card" id="gj-card">
                        <div class="balance-label">Golden<br>Joysticks</div>
                        <div class="balance-amount">
                            <span class="abbreviated">0.00</span>
                            <span class="currency-symbol">
                            <img src="images/GJ.png" alt="GJ" class="currency-icon">
                            GJ
                        </span>
                        </div>
                        <div class="balance-popup">
                            <div class="balance-label">Full Balance</div>
                            <div class="balance-amount">
                                <span class="full">0</span>
                                <span class="currency-symbol">
                                <img src="images/GJ.png" alt="GJ" class="currency-icon">
                                GJ
                            </span>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- WEEKLY CLAIM CARD -->
            <h2 class="section-title">Weekly Claim</h2>
            <div class="weekly-card">
                <i class="fa-solid fa-calendar-week weekly-icon"></i>
                <div id="weeklyStreak" class="weekly-streak">Current Streak: 0 Week(s)</div>
                <div id="weeklyReward" class="weekly-reward">Reward: 5,000 AT</div>

                <button id="claimButton" class="weekly-button" disabled>
                    Claim Weekly Reward
                </button>

                <div id="timer" class="weekly-timer" style="display: none;">
                    Next claim in: --:--:--
                </div>
                <a href="index.html" style="display: block; margin-top: 20px; color: var(--accent); text-decoration: none;">&larr; Back to Hub</a>
            </div>
        </div>

        <!-- Toast for Notifications -->
        <div id="toast" class="toast"></div>
    </div>

    <script>
        // --- IndexedDB Wrapper Class (REPLICATED from Hub) ---
        class UserDB {
            constructor() { this.dbName = 'DankArcadeHubDB'; this.storeName = 'userData'; this.db = null; }
            async open() { return new Promise((resolve, reject) => { if (this.db) { resolve(this.db); return; } const request = indexedDB.open(this.dbName, 1); request.onupgradeneeded = (event) => { const db = event.target.result; if (!db.objectStoreNames.contains(this.storeName)) { db.createObjectStore(this.storeName); } }; request.onsuccess = (event) => { this.db = event.target.result; resolve(this.db); }; request.onerror = (event) => { console.error("IndexedDB error:", event.target.errorCode); reject(new Error("Failed to open IndexedDB")); }; }); }
            async get(key) { const db = await this.open(); return new Promise((resolve, reject) => { const transaction = db.transaction(this.storeName, 'readonly'); const store = transaction.objectStore(this.storeName); const request = store.get(key); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); }
            async set(key, value) { const db = await this.open(); return new Promise((resolve, reject) => { const transaction = db.transaction(this.storeName, 'readwrite'); const store = transaction.objectStore(this.storeName); const request = store.put(value, key); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); }
        }

        const userDB = new UserDB();
        const ONE_WEEK = 7 * 24 * 60 * 60 * 1000;
        const TWO_WEEKS = 2 * ONE_WEEK;
        const BASE_REWARD = 5000;
        const STREAK_BONUS = 500;
        const LAST_CLAIM_KEY = 'lastWeeklyClaim';
        const STREAK_KEY = 'weeklyStreak';
        let timerInterval;

        // --- Core Application Logic (REPLICATED & MODIFIED) ---
        function formatNumber(num) { if (num < 1000) return num.toLocaleString(undefined, { maximumFractionDigits: 0 }); if (num >= 1e12) return (num / 1e12).toFixed(2) + 't'; if (num >= 1e9) return (num / 1e9).toFixed(2) + 'b'; if (num >= 1e6) return (num / 1e6).toFixed(2) + 'm'; if (num >= 1e3) return (num / 1e3).toFixed(2) + 'k'; return num.toString(); }
        function showToast(message, duration = 3000) { const toast = document.getElementById('toast'); if(toast) { toast.textContent = message; toast.classList.add('show'); setTimeout(() => { toast.classList.remove('show'); }, duration); } }

        async function getUserData() {
            const defaultData = { arcadeTokens: 0, goldenJoysticks: 0, lastWeeklyClaim: 0, weeklyStreak: 0 };
            try {
                let data = await userDB.get('user');
                if (!data) { data = defaultData; await userDB.set('user', data); }
                data.weeklyStreak = data.weeklyStreak || 0;
                data.lastWeeklyClaim = data.lastWeeklyClaim || 0;
                return data;
            } catch (e) { console.error("Error retrieving user data:", e); return defaultData; }
        }

        async function saveUserData(data) { try { await userDB.set('user', data); } catch (e) { console.error("Error saving user data:", e); showToast("Error saving data!", 5000); } }

        async function updateBalances() {
            const data = await getUserData();
            const atAbbr = document.querySelector('#at-card .abbreviated');
            const atFull = document.querySelector('#at-card .full');
            const gjAbbr = document.querySelector('#gj-card .abbreviated');
            const gjFull = document.querySelector('#gj-card .full');
            if(atAbbr) atAbbr.textContent = formatNumber(data.arcadeTokens);
            if(atFull) atFull.textContent = data.arcadeTokens.toLocaleString();
            if(gjAbbr) gjAbbr.textContent = formatNumber(data.goldenJoysticks);
            if(gjFull) gjFull.textContent = data.goldenJoysticks.toLocaleString();
            return data;
        }

        // --- Weekly Functionality ---
        function calculateReward(streak) { return BASE_REWARD + (streak * STREAK_BONUS); }
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const days = Math.floor(totalHours / 24);
            const hours = totalHours % 24;
            const minutes = totalMinutes % 60;
            const seconds = totalSeconds % 60;
            const pad = (num) => String(num).padStart(2, '0');
            return `${days}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
        }

        async function checkWeeklyStatus() {
            const data = await updateBalances();
            const now = Date.now();
            const claimButton = document.getElementById('claimButton');
            const timerDiv = document.getElementById('timer');
            const rewardDiv = document.getElementById('weeklyReward');
            const streakDiv = document.getElementById('weeklyStreak');

            if(!claimButton || !timerDiv || !rewardDiv || !streakDiv) return;

            const lastClaim = data[LAST_CLAIM_KEY] || 0;
            let currentStreak = data[STREAK_KEY] || 0;

            if (lastClaim !== 0 && now - lastClaim > TWO_WEEKS) {
                currentStreak = 0;
                data[STREAK_KEY] = 0;
                await saveUserData(data);
                showToast("Your weekly streak was lost!", 5000);
            }

            const reward = calculateReward(currentStreak);
            streakDiv.textContent = `Current Streak: ${currentStreak} Week(s)`;
            rewardDiv.textContent = `Reward: ${reward.toLocaleString()} AT`;

            if (now - lastClaim >= ONE_WEEK) {
                claimButton.disabled = false;
                claimButton.textContent = "Claim Weekly Reward";
                timerDiv.style.display = 'none';
                if (lastClaim !== 0 && now - lastClaim < TWO_WEEKS) {
                    const nextReward = calculateReward(currentStreak + 1);
                    rewardDiv.textContent = `Next Reward: ${nextReward.toLocaleString()} AT`;
                } else {
                    rewardDiv.textContent = `Reward: ${reward.toLocaleString()} AT`;
                }
            } else {
                claimButton.disabled = true;
                claimButton.textContent = "Claim Not Yet Available";
                timerDiv.style.display = 'block';
                clearInterval(timerInterval);
                const updateTimer = () => {
                    const remaining = ONE_WEEK - (Date.now() - lastClaim);
                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        checkWeeklyStatus();
                        return;
                    }
                    timerDiv.textContent = `Next claim in: ${formatTime(remaining)}`;
                };
                updateTimer();
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        async function handleClaim() {
            const data = await getUserData();
            const now = Date.now();

            if (now - data[LAST_CLAIM_KEY] >= ONE_WEEK) {
                const lastClaim = data[LAST_CLAIM_KEY] || 0;
                let currentStreak = data[STREAK_KEY] || 0;
                if (lastClaim !== 0 && now - lastClaim < TWO_WEEKS) {
                    currentStreak += 1;
                } else {
                    currentStreak = 1;
                }
                const reward = calculateReward(currentStreak);
                data.arcadeTokens += reward;
                data[LAST_CLAIM_KEY] = now;
                data[STREAK_KEY] = currentStreak;
                await saveUserData(data);
                showToast(`SUCCESS! Claimed ${reward.toLocaleString()} AT. Weekly Streak: ${currentStreak} Week(s)!`);
                checkWeeklyStatus();
            } else {
                showToast("Not yet available. Please wait.", 3000);
            }
        }

        function setupBalanceCards() {
            const cards = document.querySelectorAll('.balance-card');
            cards.forEach(card => { card.addEventListener('click', function(e) { cards.forEach(c => { if (c !== card) c.classList.remove('active'); }); this.classList.toggle('active'); }); });
            document.addEventListener('click', function(e) { if (!e.target.closest('.balance-card')) { cards.forEach(card => card.classList.remove('active')); } });
        }

        // --- ANIMATION & TRANSITION SCRIPT ---
        function handleNavigation(event) {
            const link = event.currentTarget;
            const url = new URL(link.href, window.location.origin);
            if (url.origin !== window.location.origin || link.target === '_blank' || event.ctrlKey || event.metaKey) return;
            event.preventDefault();
            const bodyWrapper = document.getElementById('body-wrapper');
            const loadingOverlay = document.getElementById('loading-overlay');
            bodyWrapper.classList.add('fade-out');
            setTimeout(() => { loadingOverlay.classList.add('visible'); }, 200);
            fetch(url.href)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const newBodyWrapper = doc.getElementById('body-wrapper');
                    const newTitle = doc.querySelector('title').innerText;
                    setTimeout(() => {
                        bodyWrapper.innerHTML = newBodyWrapper.innerHTML;
                        document.title = newTitle;
                        history.pushState({}, newTitle, url.href);
                        const newMainScript = Array.from(doc.querySelectorAll('script')).find(s => s.innerText.includes('new UserDB'));
                        if (newMainScript) {
                           eval(newMainScript.innerText);
                        }
                        loadingOverlay.classList.remove('visible');
                        setTimeout(() => { bodyWrapper.classList.remove('fade-out'); }, 50);
                    }, 1200);
                })
                .catch(err => {
                    console.error('Failed to load page: ', err);
                    window.location.href = url.href;
                });
        }

        function attachNavigationHandlers() {
            document.querySelectorAll('a[href]').forEach(link => {
                const url = new URL(link.href, window.location.origin);
                if (url.origin === window.location.origin && !link.href.endsWith('#')) {
                    link.removeEventListener('click', handleNavigation);
                    link.addEventListener('click', handleNavigation);
                }
            });
        }

        // --- Initialization ---
        function initializePage() {
            userDB.open().then(() => {
                checkWeeklyStatus();
            }).catch(e => {
                console.error("DB Initialization Failed:", e);
                showToast("Failed to load user data from storage!", 8000);
            });
            const claimButton = document.getElementById('claimButton');
            if(claimButton) claimButton.addEventListener('click', handleClaim);
            setupBalanceCards();
            attachNavigationHandlers();
            setInterval(updateBalances, 30000);
        }

        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
